# Spec for ~/video-readme-maker:  python3 eval/demo_bench.py && python3 ~/video-readme-maker/vrm.py all README.spec.yml
# Numbers come from eval/results/demo.json (a deterministic SYNTHETIC catalog; there is no real-store benchmark in this repo).
project:
  name: ontolagni
  emoji: "🧭"
  tagline: "Middleware ontology: what data exists where. JSON for agents, pointers into traceDB"
  repo: Bobliuuu/ontolagni
hero:
  title: ontolagni
  subtitle: "ask in plain words, get the node, the cost and the next command"
  chips: [stdlib only, siloed, verifiable digests, agent-first JSON]
theme: {accent: "#a78bfa", accent2: "#ff6b6b", accent3: "#f2c14e", good: "#3ddc97"}
readme_out: README.md
assets_dir: assets
badges:
  - {label: python, message: "3.10+", color: 3776ab, logo: python}
  - {label: dependencies, message: "none (stdlib only)", color: 3ddc97}
  - {label: output, message: "JSON for agents", color: a78bfa}
  - {label: verify, message: "digest per subtree", color: f2c14e}
  - {label: release, message: v0.2.1, color: a78bfa, logo: github, link: "https://github.com/Bobliuuu/ontolagni/releases/tag/v0.2.1"}
  - {label: pairs with, message: traceDB, color: 27c8e8, link: "https://github.com/Bobliuuu/traceDB"}
nav:
  - {emoji: "🎬", label: Video, anchor: video}
  - {emoji: "🚀", label: Quick use, anchor: quick-use}
