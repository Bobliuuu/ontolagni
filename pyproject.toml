[project]
name = "ontolagni"
version = "0.1.0"
description = "Siloed ontology/index: what data exists where (pointers into traceDB). Stdlib only."
requires-python = ">=3.10"
dependencies = []
[project.optional-dependencies]
test = ["pytest"]
[project.scripts]
ontolagni = "ontolagni.cli:main"
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[tool.setuptools]
packages = ["ontolagni"]
[tool.pytest.ini_options]
testpaths = ["tests"]
